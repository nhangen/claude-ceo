name: Tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supersede in-flight runs for the same ref: a rapid push sequence keeps only
# the newest run, freeing the older ones' minutes instead of running them out.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          scandir: ./scripts
          severity: warning
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run script tests
        # The *.test.sh files run concurrently: each is either pure-logic (sources a
        # lib, asserts in memory) or isolates its writes via mktemp / $$-scoped paths,
        # and no two write the same fixed path under scripts/ — that no-fixed-name-
        # collision property is what keeps -P 4 safe. Output is captured per-file and
        # printed as a whole block to keep failures readable under interleaving; xargs
        # exits non-zero if any test does, failing the step.
        run: |
          shopt -s nullglob
          tests=(scripts/*.test.sh)
          [ "${#tests[@]}" -ge 1 ] || { echo "no tests ran"; exit 1; }
          printf '%s\n' "${tests[@]}" | xargs -P 4 -I {} bash -c '
            out=$(bash "$1" 2>&1); rc=$?
            printf "=== %s (rc=%d) ===\n%s\n" "$1" "$rc" "$out"
            exit "$rc"
          ' _ {}
      - name: ollama-agent pytest
        run: |
          python3 -m pip install --quiet pytest
          cd ollama-agent && python3 -m pytest -q
  # The shell tests on macOS, because /bin/bash there is 3.2.57 and the ubuntu
  # job's bash 5 cannot see a whole class of 3.2 behavior. The one that prompted
  # this (#372): a failed redirection on a compound command does not abort under
  # `set -e` on 3.2, so `ceo_workers_reap` fell through an unreadable state file,
  # truncated it, and returned 0 — destroying every in-flight worker's
  # reservation while reporting a clean sweep. A test for it had existed and
  # passed the whole time, because nothing ran it on a shell that could fail.
  #
  # Scoped to the shell suite deliberately: macOS runners bill at 10x, and pytest
  # and bun are shell-version-independent, so duplicating them buys nothing.
  test-bash32:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pin bash 3.2 on PATH
        # Invoking the test files with /bin/bash only pins their *own* shell. The
        # interesting subprocesses resolve `bash` through PATH — ceo-loop.test.sh
        # runs `bash "$LOOP"`, and the 110 failures behind #387 come from
        # `mapfile` inside that child, not the parent. So without this shim both
        # the coverage and the retirement gate below depend on whatever bash the
        # runner image happens to put first, which is not something to leave to
        # an image update.
        run: |
          mkdir -p "$RUNNER_TEMP/b32" && ln -sf /bin/bash "$RUNNER_TEMP/b32/bash"
          echo "$RUNNER_TEMP/b32" >> "$GITHUB_PATH"
      - name: Confirm bash is 3.2
        # An error, not a warning: with the shim in place a non-3.x bash means
        # this job is silently a duplicate of the ubuntu one, and a job that
        # covers nothing should not pass quietly.
        run: |
          /bin/bash --version | head -1
          bash --version | head -1
          bash --version | head -1 | grep -q "version 3" \
            || { echo "::error::bash is no longer 3.x — this job no longer covers what it was added for"; exit 1; }
      - name: Run script tests under bash 3.2
        # ceo-loop.test.sh is excluded: it fails 110 asserts under 3.2 on main,
        # predating this job, and fixing it is #387 rather than this PR. The
        # exclusion retires itself — the step below fails once that file passes,
        # so nobody has to remember to come back and delete this line.
        run: |
          shopt -s nullglob
          known_red=scripts/ceo-loop.test.sh
          # Renaming the excluded file would otherwise leave the filter matching
          # nothing and the gate below invoking a missing path — rc 127, which
          # reads as "still red" and passes with a stale exclusion.
          [ -f "$known_red" ] || { echo "known_red no longer exists: $known_red"; exit 1; }
          tests=()
          for t in scripts/*.test.sh; do
            [ "$t" = "$known_red" ] || tests+=("$t")
          done
          [ "${#tests[@]}" -ge 1 ] || { echo "no tests ran"; exit 1; }
          printf '%s\n' "${tests[@]}" | xargs -P 4 -I {} /bin/bash -c '
            out=$(/bin/bash "$1" 2>&1); rc=$?
            printf "=== %s (rc=%d) ===\n%s\n" "$1" "$rc" "$out"
            exit "$rc"
          ' _ {}
      - name: The bash 3.2 exclusion is still needed
        run: |
          known_red=scripts/ceo-loop.test.sh
          [ -f "$known_red" ] || { echo "known_red no longer exists: $known_red"; exit 1; }
          if /bin/bash "$known_red" >/dev/null 2>&1; then
            echo "scripts/ceo-loop.test.sh now passes under bash 3.2 (#387)."
            echo "Delete the known_red exclusion above and this step."
            exit 1
          fi
          echo "still red under 3.2, exclusion stands"
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Install bun via the official versioned script rather than a third-party
      # action, matching the repo's minimal-action posture.
      - name: Install bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.5"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      # The scheduler depends on the cronbird package via a path dependency
      # ("cronbird": "file:../../../cronbird"), which resolves to a sibling of
      # the checkout dir. Clone it there so bun install can link it. cronbird is
      # public, so no credential is needed.
      - name: Check out cronbird (path dependency)
        # Pinned to a known-good commit rather than tracking HEAD. cronbird is a
        # source-level path dependency, so our strict `tsc` compiles its internals
        # too — an unpinned HEAD lets any upstream cronbird change (new required
        # DaemonDeps fields, stricter code) break this job with no change here.
        # The daemon runs against this same ref in production; bump deliberately
        # (update CRONBIRD_REF, adapt src/main.ts, re-run) when adopting new
        # cronbird features.
        env:
          CRONBIRD_REF: 7b8f35ebb2b8b7f534cd105438b2b2601f2a2763
        run: |
          git clone --filter=blob:none https://github.com/nhangen/cronbird.git "${GITHUB_WORKSPACE}/../cronbird"
          git -C "${GITHUB_WORKSPACE}/../cronbird" checkout --quiet "$CRONBIRD_REF"
          # cronbird needs its own node_modules (croner) so module resolution
          # from its source resolves — bun links the package but hoists its deps
          # into the consumer tree, which cronbird's own files can't reach.
          ( cd "${GITHUB_WORKSPACE}/../cronbird" && bun install --frozen-lockfile )
      - name: scheduler lib — install, typecheck, test
        working-directory: lib/scheduler
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test
